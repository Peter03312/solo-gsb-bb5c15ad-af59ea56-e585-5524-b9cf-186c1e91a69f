services:
  subtitle-proof:
    build:
      context: .
      dockerfile: Dockerfile
    image: subtitle-proof:latest
    container_name: subtitle-proof
    ports:
      # Web UI + API: http://localhost:8080
      - "${HOST_PORT:-8080}:8080"
    environment:
      DB_PATH: /data/subtitles.db
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      SEED_USERS: "true"
      SEED_SAMPLE_SRT: ${SEED_SAMPLE_SRT:-true}
    volumes:
      - subtitle-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  subtitle-data:
